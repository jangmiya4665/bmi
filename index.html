<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI 측정기</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"맑은 고딕",sans-serif;
}

body{
    background:#FFF9C4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#wrap{

    width:580px;

    background:white;

    border:8px solid #F8BBD0;

    border-radius:25px;

    box-shadow:0 10px 25px rgba(0,0,0,0.2);

    padding:35px;

    text-align:center;

}

h1{

    color:#C2185B;

    font-size:48px;

    margin-bottom:25px;

    letter-spacing:3px;

}

table{

    width:100%;

}

td{

    padding:15px;

    font-size:23px;

    color:#444;

    font-weight:bold;

}

input{

    width:200px;

    height:45px;

    border:2px solid #F48FB1;

    border-radius:10px;

    text-align:center;

    font-size:22px;

    outline:none;

}

input:focus{

    border-color:#C2185B;

}

button{

    width:220px;

    height:55px;

    margin-top:20px;

    background:#EC407A;

    color:white;

    font-size:24px;

    font-weight:bold;

    border:none;

    border-radius:30px;

    cursor:pointer;

    transition:0.3s;

}

button:hover{

    background:#C2185B;

    transform:scale(1.05);

}

#result{

    margin-top:25px;

    font-size:28px;

    color:#1565C0;

    font-weight:bold;

}

#advice{

    margin-top:20px;

    padding:18px;

    border-radius:15px;

    background:#FFF3F8;

    border:2px solid #F8BBD0;

    text-align:left;

    line-height:1.8;

    font-size:19px;

    color:#444;

}

#name{

    margin-top:30px;

    font-size:42px;

    color:#AD1457;

    font-weight:bold;

    letter-spacing:8px;

}

</style>

<script>

function bmi(){

    let h=parseFloat(document.getElementById("height").value);
    let w=parseFloat(document.getElementById("weight").value);

    if(isNaN(h)||isNaN(w)||h<=0||w<=0){

        alert("키와 몸무게를 정확하게 입력하세요.");

        return;

    }

    let m=h/100;

    let value=(w/(m*m)).toFixed(1);

    let state="";
    let advice="";

    if(value<18.5){

        state="저체중";

        advice=
        "🌷 단백질이 풍부한 음식(계란, 생선, 두부)을 충분히 섭취하세요.<br>"+
        "🌷 하루 세 끼를 규칙적으로 드시고 간식은 견과류를 선택하세요.<br>"+
        "🌷 근력운동을 주 3회 이상 실천해 건강한 체중을 만들어 보세요.<br>"+
        "🌷 충분한 수면(7~8시간)을 유지하세요.";

    }

    else if(value<23){

        state="정상";

        advice=
        "🌼 현재 체중을 잘 유지하고 계십니다.<br>"+
        "🌼 하루 30분 이상 걷기 또는 가벼운 운동을 꾸준히 하세요.<br>"+
        "🌼 채소와 과일을 충분히 섭취하고 물을 자주 마시세요.<br>"+
        "🌼 규칙적인 생활습관을 계속 유지하세요.";

    }

    else if(value<25){

        state="과체중";

        advice=
        "🌸 하루 40분 정도 빠르게 걷기를 시작해 보세요.<br>"+
        "🌸 탄산음료와 야식을 줄여보세요.<br>"+
        "🌸 식사량은 조금 줄이고 채소를 더 많이 드세요.<br>"+
        "🌸 매주 체중을 기록하며 관리해 보세요.";

    }

    else if(value<30){

        state="비만";

        advice=
        "💗 하루 1시간 이상 유산소 운동을 권장합니다.<br>"+
        "💗 튀김, 과자, 단 음식을 줄이세요.<br>"+
        "💗 저녁 식사는 잠들기 3시간 전에 마치세요.<br>"+
        "💗 한 달 목표 체중을 정하고 꾸준히 실천하세요.";

    }

    else{

        state="고도비만";

        advice=
        "❤️ 전문의와 상담하여 건강검진을 받아보세요.<br>"+
        "❤️ 무리한 운동보다는 걷기부터 시작하세요.<br>"+
        "❤️ 식단을 체계적으로 관리하고 충분한 수분을 섭취하세요.<br>"+
        "❤️ 꾸준한 생활습관 개선으로 건강을 회복해 보세요.";

    }

    document.getElementById("result").innerHTML=
    "BMI : "+value+" ("+state+")";

    document.getElementById("advice").innerHTML=
    "<b>👩‍⚕️ 의사의 조언</b><br><br>"+advice;

}

</script>

</head>

<body>

<div id="wrap">

<h1>🌸 BMI 측정기 🌸</h1>

<table>

<tr>
<td>📏 키(cm)</td>
<td><input type="number" id="height"></td>
</tr>

<tr>
<td>⚖ 몸무게(kg)</td>
<td><input type="number" id="weight"></td>
</tr>

</table>

<button onclick="bmi()">💖 BMI 계산하기</button>

<div id="result"></div>

<div id="advice"></div>

<div id="name">장 미 야</div>

</div>

</body>
</html>
